[project]
name = "dwdforecast"
version = "0.1.0"
description = "Small Python tool to extract MOSMIX forecast data from DWD and run PVLIB simulations for PV systems."
authors = [ { name = "Kilian Knoll" }, { name = "Sven Witterstein" } ]
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/kilianknoll/DWDForecast"

dependencies = [
  "numpy>=1.25",
  "pandas>=2.0",
  "pvlib>=0.10",
  "scipy>=1.10",
  "requests>=2.28",
  "beautifulsoup4>=4.12",
  "mysql-connector-python>=8.0",
  "lxml>=4.9",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
